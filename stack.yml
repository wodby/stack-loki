name: loki
title: Grafana Loki
icon: loki
docs: https://wodby.com/docs/2.0/stacks/catalog/loki/

services:
- name: loki
  title: Grafana Loki
  service: loki
  required: true
  volumes:
  - name: data
    size: 20
  workloads:
  - name: main
    containers:
    - name: loki
      resources:
        request:
          cpu: 200
          memory: 512
        limit:
          cpu: 1000
          memory: 2048
- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  links:
  - name: loki
    service: loki
  configs:
  - name: config
    config: configs/otel-collector.yaml
  workloads:
  - name: main
    containers:
    - name: otelcol
      resources:
        request:
          cpu: 100
          memory: 128
        limit:
          cpu: 500
          memory: 512
- name: grafana
  title: Grafana
  service: grafana
  main: true
  links:
  - name: loki
    service: loki
  configs:
  - name: datasources
    config: configs/grafana-datasources.yml.tmpl
  volumes:
  - name: data
    size: 10
  workloads:
  - name: main
    containers:
    - name: grafana
      resources:
        request:
          cpu: 200
          memory: 512
        limit:
          cpu: 1000
          memory: 1024
