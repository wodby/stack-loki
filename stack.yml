name: loki
title: Grafana Loki
icon: loki
docs: https://wodby.com/docs/2.0/stacks/catalog/loki/

services:
- name: loki
  title: Grafana Loki
  service: loki
  required: true
  volumes:
  - name: data
    size: 20
- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  links:
  - name: logs
    service: loki
- name: grafana
  title: Grafana
  service: grafana
  main: true
  links:
  - name: loki
    service: loki
  configs:
  - name: datasources
    config: configs/grafana-datasources.yml.tmpl
  volumes:
  - name: data
    size: 10
